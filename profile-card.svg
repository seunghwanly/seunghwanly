<svg width="960" height="380" viewBox="0 0 960 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Seunghwan Lee의 기술 태양계</title>
  <desc id="desc">SEUNGHWANLY를 중심으로 Dart, Flutter, React, Python, FastAPI, AWS 기술 심볼이 공전하는 애니메이션 카드</desc>
  <defs>
    <radialGradient id="space" cx="0" cy="0" r="1" gradientTransform="translate(715 180) rotate(137) scale(730 530)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14224A"/>
      <stop offset=".42" stop-color="#080D22"/>
      <stop offset="1" stop-color="#030611"/>
    </radialGradient>
    <linearGradient id="type-glass" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#68758F" stop-opacity=".7"/>
