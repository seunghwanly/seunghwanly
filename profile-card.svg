<svg width="960" height="380" viewBox="0 0 960 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Seunghwan Lee의 기술 태양계</title>
  <desc id="desc">SEUNGHWANLY를 중심으로 Flutter, Dart, React, FastAPI, AWS 기술 유리 구체가 공전하는 애니메이션 카드</desc>
  <defs>
    <radialGradient id="space" cx="0" cy="0" r="1" gradientTransform="translate(715 180) rotate(137) scale(730 530)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14224A"/>
      <stop offset=".42" stop-color="#080D22"/>
      <stop offset="1" stop-color="#030611"/>
    </radialGradient>
    <linearGradient id="core-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#7895FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#17224D" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="cyan-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".48"/>
      <stop offset=".4" stop-color="#62DFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#183B5A" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="blue-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".48"/>
      <stop offset=".4" stop-color="#6C92FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#1A285C" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="mint-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".48"/>
      <stop offset=".4" stop-color="#71E0C6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#174E4A" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="violet-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".48"/>
      <stop offset=".4" stop-color="#AE87FF" stop-opacity=".23"/>
      <stop offset="1" stop-color="#39245F" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="orange-glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".48"/>
      <stop offset=".4" stop-color="#FFAD57" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5D321D" stop-opacity=".3"/>
    </linearGradient>
    <filter id="glass-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#050817" flood-opacity=".7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#89A4FF" flood-opacity=".25"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .o1 { transform-origin: 726px 190px; animation: spin 7s linear infinite; }
      .o2 { transform-origin: 726px 190px; animation: spin 11s linear infinite; }
      .o3 { transform-origin: 726px 190px; animation: spin 17s linear infinite; }
      .o4 { transform-origin: 726px 190px; animation: spin 25s linear infinite; }
      .o5 { transform-origin: 726px 190px; animation: spin 35s linear infinite; }
      .g1 { transform-origin: 782px 190px; animation: cspin 7s linear infinite; }
      .g2 { transform-origin: 640px 190px; animation: cspin 11s linear infinite; }
      .g3 { transform-origin: 726px 128px; animation: cspin 17s linear infinite; }
      .g4 { transform-origin: 883px 190px; animation: cspin 25s linear infinite; }
      .g5 { transform-origin: 530px 190px; animation: cspin 35s linear infinite; }
      .comet { animation: comet 5s ease-in infinite; }
      .pulse { transform-origin: 726px 190px; animation: pulse 2.8s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes cspin { to { transform: rotate(-360deg); } }
      @keyframes pulse { 50% { transform: scale(1.12); opacity: .72; } }
      @keyframes comet {
        0%, 18% { opacity: 0; transform: translate(-40px,-25px); }
        42% { opacity: 1; }
        70%, 100% { opacity: 0; transform: translate(180px,100px); }
      }
      @media (prefers-reduced-motion: reduce) { .o1,.o2,.o3,.o4,.o5,.g1,.g2,.g3,.g4,.g5,.comet,.pulse { animation: none; } }
    </style>
  </defs>

  <rect width="960" height="380" rx="28" fill="url(#space)"/>
  <g fill="#C8D6FF">
    <circle cx="48" cy="41" r="1"/><circle cx="114" cy="292" r=".8"/><circle cx="183" cy="67" r=".7"/>
    <circle cx="256" cy="326" r="1"/><circle cx="319" cy="44" r=".6"/><circle cx="374" cy="256" r=".8"/>
    <circle cx="438" cy="96" r=".7"/><circle cx="507" cy="333" r="1"/><circle cx="551" cy="36" r=".7"/>
    <circle cx="609" cy="302" r=".8"/><circle cx="655" cy="71" r=".6"/><circle cx="820" cy="45" r=".9"/>
    <circle cx="895" cy="116" r=".7"/><circle cx="923" cy="309" r="1"/><circle cx="846" cy="343" r=".6"/>
  </g>
  <g fill="#7898FF" opacity=".55">
    <circle cx="88" cy="166" r="1.4"/><circle cx="292" cy="179" r="1.2"/><circle cx="462" cy="288" r="1.3"/>
    <circle cx="578" cy="139" r="1.2"/><circle cx="893" cy="224" r="1.3"/>
  </g>

  <g class="sans">
    <text x="54" y="66" fill="#8EA8FF" font-size="13" font-weight="700" letter-spacing="2.5">SEUNGHWAN'S UNIVERSE</text>
    <text x="52" y="129" fill="#F4F6FF" font-size="44" font-weight="760">My stack is</text>
    <text x="52" y="178" fill="#F4F6FF" font-size="44" font-weight="760">a solar system.</text>
    <text x="54" y="221" fill="#9FAAC7" font-size="15">기술은 목적지가 아닌 궤도.</text>
    <text x="54" y="246" fill="#9FAAC7" font-size="15">모든 선택은 사용자 가치로 향합니다.</text>
  </g>
  <g class="mono">
    <rect x="54" y="294" width="205" height="36" rx="18" fill="#111B3B" stroke="#334C89"/>
    <circle cx="76" cy="312" r="4" fill="#8EA8FF"/>
    <text x="91" y="316" fill="#B8C8FF" font-size="11">ENTER THE SYSTEM →</text>
  </g>

  <g stroke="#40507A" opacity=".62">
    <ellipse cx="726" cy="190" rx="56" ry="26"/>
    <ellipse cx="726" cy="190" rx="86" ry="42"/>
    <ellipse cx="726" cy="190" rx="120" ry="62"/>
    <ellipse cx="726" cy="190" rx="157" ry="84"/>
    <ellipse cx="726" cy="190" rx="196" ry="111"/>
  </g>
  <rect x="676" y="170" width="100" height="40" rx="20" fill="#728DFF" opacity=".14" class="pulse"/>
  <rect x="676" y="170" width="100" height="40" rx="20" fill="url(#core-glass)" stroke="#B6C4FF" stroke-opacity=".62" filter="url(#glass-glow)"/>
  <path d="M688 177H763" stroke="white" stroke-opacity=".42" stroke-linecap="round"/>
  <text x="726" y="188" fill="#F5F7FF" class="sans" font-size="9" font-weight="700" text-anchor="middle">SEUNGHWANLY</text>
  <text x="726" y="201" fill="#96A9F2" class="mono" font-size="6" text-anchor="middle" letter-spacing="1.5">CORE</text>

  <g class="o1">
    <g class="g1" filter="url(#glass-glow)">
      <text x="782" y="195" fill="url(#cyan-glass)" stroke="#9BEAFF" stroke-width=".55" paint-order="stroke fill" class="sans" font-size="15" font-weight="800" text-anchor="middle">Dart</text>
    </g>
  </g>
  <g class="o2">
    <g class="g2" filter="url(#glass-glow)">
      <text x="640" y="195" fill="url(#blue-glass)" stroke="#AFC0FF" stroke-width=".55" paint-order="stroke fill" class="sans" font-size="15" font-weight="800" text-anchor="middle">Flutter</text>
    </g>
  </g>
  <g class="o3">
    <g class="g3" filter="url(#glass-glow)">
      <text x="726" y="133" fill="url(#mint-glass)" stroke="#A8F2E2" stroke-width=".55" paint-order="stroke fill" class="sans" font-size="15" font-weight="800" text-anchor="middle">React</text>
    </g>
  </g>
  <g class="o4">
    <g class="g4" filter="url(#glass-glow)">
      <text x="883" y="195" fill="url(#violet-glass)" stroke="#D5C0FF" stroke-width=".55" paint-order="stroke fill" class="sans" font-size="15" font-weight="800" text-anchor="middle">FastAPI</text>
    </g>
  </g>
  <g class="o5">
    <g class="g5" filter="url(#glass-glow)">
      <text x="530" y="195" fill="url(#orange-glass)" stroke="#FFD8AF" stroke-width=".55" paint-order="stroke fill" class="sans" font-size="14" font-weight="800" text-anchor="middle">AWS · CI/CD</text>
    </g>
  </g>
  <g class="comet">
    <path d="M555 75L510 47" stroke="#C8F7FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="555" cy="75" r="3" fill="#E9FCFF" filter="url(#glass-glow)"/>
  </g>
  <text x="770" y="350" fill="#7280A4" class="mono" font-size="9" letter-spacing="1.5">AI AUTOMATION / COMET</text>
  <rect x=".5" y=".5" width="959" height="379" rx="27.5" stroke="#26365E"/>
</svg>
