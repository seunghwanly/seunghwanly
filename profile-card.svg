<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Seunghwan Lee — Frontend Developer</title>
  <desc id="desc">Flutter, Web, Automation 궤도를 오가는 개발자를 표현한 애니메이션 카드</desc>
  <defs>
    <linearGradient id="bg" x1="50" y1="20" x2="900" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset=".5" stop-color="#0B1728"/>
      <stop offset="1" stop-color="#09121E"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#61E7C5" stop-opacity=".28"/>
      <stop offset="1" stop-color="#61E7C5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#61E7C5"/>
      <stop offset="1" stop-color="#77A7FF"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .orbit { transform-origin: 758px 180px; animation: spin 18s linear infinite; }
      .orbit-reverse { transform-origin: 758px 180px; animation: spin-reverse 12s linear infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .blink { animation: blink 2.2s steps(1) infinite; }
      .dash { stroke-dasharray: 5 12; animation: dash 12s linear infinite; }
      .signal { animation: signal 4.8s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-reverse { to { transform: rotate(-360deg); } }
      @keyframes pulse { 50% { opacity: .42; transform: scale(.94); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes dash { to { stroke-dashoffset: -170; } }
      @keyframes signal { 0%, 100% { opacity: .25; } 45%, 55% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .orbit-reverse, .pulse, .blink, .dash, .signal { animation: none; }
      }
    </style>
  </defs>

  <rect width="960" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 292C202 238 300 350 488 286C657 228 731 280 960 210V360H0V292Z" fill="#0F2034" opacity=".7"/>
  <path d="M0 309C188 258 322 350 502 302C673 256 774 289 960 238" stroke="#19334D" stroke-width="1"/>
  <g opacity=".4">
    <path d="M68 42V318M118 42V318M168 42V318M218 42V318M268 42V318M318 42V318M368 42V318M418 42V318M468 42V318M518 42V318" stroke="#173047"/>
    <path d="M42 80H555M42 130H555M42 180H555M42 230H555M42 280H555" stroke="#173047"/>
  </g>

  <g class="sans">
    <text x="56" y="68" fill="#61E7C5" font-size="14" font-weight="700" letter-spacing="2.4">BUILDING ACROSS BOUNDARIES</text>
    <text x="54" y="132" fill="#F2F7FC" font-size="46" font-weight="720">Seunghwan Lee</text>
    <text x="56" y="171" fill="#9DB0C2" font-size="20">Frontend Developer · Flutter → Web → Automation</text>
    <text x="56" y="227" fill="#D6E0E8" font-size="16">문제를 따라 플랫폼 경계를 넘고,</text>
    <text x="56" y="254" fill="#D6E0E8" font-size="16">더 빠른 피드백 루프를 만듭니다.</text>
  </g>

  <g class="mono">
    <rect x="56" y="289" width="211" height="34" rx="17" fill="#102C32" stroke="#265C58"/>
    <circle cx="76" cy="306" r="4" fill="#61E7C5" class="blink"/>
    <text x="90" y="311" fill="#9FEED9" font-size="12">tap to enter orbit</text>
  </g>

  <circle cx="758" cy="180" r="142" fill="url(#halo)" class="pulse" style="transform-origin:758px 180px"/>
  <circle cx="758" cy="180" r="105" stroke="#2C4B62" class="dash"/>
  <circle cx="758" cy="180" r="68" stroke="#29445B" stroke-dasharray="3 8"/>
  <g class="orbit">
    <circle cx="758" cy="75" r="8" fill="#61E7C5" filter="url(#glow)"/>
    <circle cx="758" cy="75" r="18" stroke="#61E7C5" opacity=".25"/>
  </g>
  <g class="orbit-reverse">
    <circle cx="826" cy="180" r="7" fill="#77A7FF" filter="url(#glow)"/>
  </g>
  <circle cx="758" cy="180" r="39" fill="#0E2634" stroke="url(#line)" stroke-width="2"/>
  <path d="M744 180L754 190L774 169" stroke="#C6FFF0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g class="mono" font-size="11" letter-spacing="1">
    <text x="720" y="43" fill="#61E7C5" class="signal">FLUTTER</text>
    <text x="866" y="185" fill="#77A7FF" class="signal" style="animation-delay:1.6s">WEB</text>
    <text x="696" y="330" fill="#B697FF" class="signal" style="animation-delay:3.2s">AUTOMATION</text>
  </g>
  <path d="M820 95L850 67M839 278L874 302M643 233L614 246" stroke="#4D718C"/>
  <circle cx="850" cy="67" r="3" fill="#61E7C5"/>
  <circle cx="874" cy="302" r="3" fill="#B697FF"/>
  <circle cx="614" cy="246" r="3" fill="#77A7FF"/>
  <rect x=".5" y=".5" width="959" height="359" rx="27.5" stroke="#29465D"/>
</svg>
