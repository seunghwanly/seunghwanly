      <stop offset=".58" stop-color="#9AA8C2" stop-opacity=".68"/>
      <stop offset="1" stop-color="#E5E9F2" stop-opacity=".86"/>
    </linearGradient>
    <filter id="glass-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#02040B" flood-opacity=".72"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#AAB6D1" flood-opacity=".16"/>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .o1 { transform-origin: 726px 190px; animation: spin 7s linear infinite; }
      .o2 { transform-origin: 726px 190px; animation: spin 11s linear infinite; }
      .o3 { transform-origin: 726px 190px; animation: spin 17s linear infinite; }
      .o4 { transform-origin: 726px 190px; animation: spin 23s linear infinite; }
      .o5 { transform-origin: 726px 190px; animation: spin 31s linear infinite; }
      .o6 { transform-origin: 726px 190px; animation: spin 41s linear infinite; }
      .g1 { transform-origin: 774px 190px; animation: cspin 7s linear infinite; }
      .g2 { transform-origin: 648px 190px; animation: cspin 11s linear infinite; }
      .g3 { transform-origin: 726px 138px; animation: cspin 17s linear infinite; }
      .g4 { transform-origin: 726px 258px; animation: cspin 23s linear infinite; }
      .g5 { transform-origin: 894px 190px; animation: cspin 31s linear infinite; }
      .g6 { transform-origin: 528px 190px; animation: cspin 41s linear infinite; }
      .comet { animation: comet 5s ease-in infinite; }
      .pulse { transform-origin: 726px 190px; animation: pulse 2.8s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes cspin { to { transform: rotate(-360deg); } }
      @keyframes pulse { 50% { transform: scale(1.12); opacity: .72; } }
      @keyframes comet {
        0%, 18% { opacity: 0; transform: translate(-40px,-25px); }
        42% { opacity: 1; }
        70%, 100% { opacity: 0; transform: translate(180px,100px); }
      }
      @media (prefers-reduced-motion: reduce) { .o1,.o2,.o3,.o4,.o5,.o6,.g1,.g2,.g3,.g4,.g5,.g6,.comet,.pulse { animation: none; } }
    </style>
  </defs>

